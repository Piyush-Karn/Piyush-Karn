<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Terminal session: whoami and career highlights for Piyush Kumar" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>piyush@github — whoami</title>

  <defs>
    <linearGradient id="tsweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="tbg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0A101A"/>
      <stop offset="1" stop-color="#070B12"/>
    </linearGradient>
    <clipPath id="tcard"><rect x="1" y="1" width="998" height="398" rx="16"/></clipPath>

    <clipPath id="l1"><rect x="36" y="92" width="0" height="26"><animate attributeName="width" values="0;0;245;245;0" keyTimes="0;0.030;0.085;0.97;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l2"><rect x="36" y="123" width="0" height="26"><animate attributeName="width" values="0;0;450;450;0" keyTimes="0;0.100;0.155;0.97;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l3"><rect x="36" y="154" width="0" height="26"><animate attributeName="width" values="0;0;378;378;0" keyTimes="0;0.180;0.235;0.97;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l4"><rect x="36" y="185" width="0" height="26"><animate attributeName="width" values="0;0;440;440;0" keyTimes="0;0.250;0.305;0.97;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l5"><rect x="36" y="216" width="0" height="26"><animate attributeName="width" values="0;0;400;400;0" keyTimes="0;0.320;0.375;0.97;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l6"><rect x="36" y="247" width="0" height="26"><animate attributeName="width" values="0;0;420;420;0" keyTimes="0;0.390;0.445;0.97;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l7"><rect x="36" y="278" width="0" height="26"><animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.470;0.525;0.97;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l8"><rect x="36" y="309" width="0" height="26"><animate attributeName="width" values="0;0;455;455;0" keyTimes="0;0.540;0.595;0.97;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l9"><rect x="36" y="340" width="0" height="26"><animate attributeName="width" values="0;0;172;172;0" keyTimes="0;0.620;0.650;0.97;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#tcard)">
    <rect width="1000" height="400" fill="url(#tbg)"/>

    <!-- title bar -->
    <rect width="1000" height="46" fill="#0D1522"/>
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#182338" stroke-width="1"/>
    <circle cx="30" cy="23" r="6" fill="#FF5F57"/>
    <circle cx="52" cy="23" r="6" fill="#FEBC2E"/>
    <circle cx="74" cy="23" r="6" fill="#28C840"/>
    <text x="500" y="28" text-anchor="middle" font-family="DejaVu Sans Mono,Consolas,monospace"
          font-size="13" fill="#5A6B82">piyush@github: ~/profile</text>

    <g font-family="DejaVu Sans Mono,Consolas,monospace" font-size="16">
      <g clip-path="url(#l1)">
        <text x="36" y="110"><tspan fill="#22E5A0">piyush@github</tspan><tspan fill="#58A6FF">:~$</tspan><tspan fill="#E6EDF3"> whoami</tspan></text>
      </g>
      <g clip-path="url(#l2)">
        <text x="36" y="141" fill="#93A9C4">&#8250; AI/ML Engineer &#183; KCCITM &#8217;27 &#183; Noida, India</text>
      </g>
      <g clip-path="url(#l3)">
        <text x="36" y="172"><tspan fill="#22E5A0">piyush@github</tspan><tspan fill="#58A6FF">:~$</tspan><tspan fill="#E6EDF3"> cat highlights.log</tspan></text>
      </g>
      <g clip-path="url(#l4)">
        <text x="36" y="203"><tspan fill="#F5B944">[win]</tspan><tspan fill="#C7D5E6"> Hackwave 2025 &#8212; 1st place, Duality AI</tspan></text>
      </g>
      <g clip-path="url(#l5)">
        <text x="36" y="234"><tspan fill="#00D9FF">[sec]</tspan><tspan fill="#C7D5E6"> IronGuard &#8212; 89.9% TPR at 372ms</tspan></text>
      </g>
      <g clip-path="url(#l6)">
        <text x="36" y="265"><tspan fill="#A78BFA">[cv] </tspan><tspan fill="#C7D5E6"> VisionX &#8212; 93% accuracy, sub-100ms edge</tspan></text>
      </g>
      <g clip-path="url(#l7)">
        <text x="36" y="296"><tspan fill="#22E5A0">piyush@github</tspan><tspan fill="#58A6FF">:~$</tspan><tspan fill="#E6EDF3"> status --now</tspan></text>
      </g>
      <g clip-path="url(#l8)">
        <text x="36" y="327" fill="#93A9C4">&#8250; shipping agentic AI + LLM security systems</text>
      </g>
      <g clip-path="url(#l9)">
        <text x="36" y="358"><tspan fill="#22E5A0">piyush@github</tspan><tspan fill="#58A6FF">:~$</tspan></text>
      </g>

      <!-- caret -->
      <rect x="204" y="345" width="10" height="18" fill="#00D9FF" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.648;0.652;0.97;1" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- subtle CRT sheen -->
    <rect x="-200" y="0" width="200" height="400" fill="#7CF9FF" opacity="0.035">
      <animate attributeName="x" values="-200;1000" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="998" height="398" rx="16" fill="none" stroke="url(#tsweep)" stroke-width="1.4" opacity="0.7"/>
</svg>
