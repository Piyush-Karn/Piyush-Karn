<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Piyush Kumar — AI/ML Engineer, LLM Security and Real-Time Vision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Piyush Kumar — AI/ML Engineer</title>

  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1.6" y2="0">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="0.35" stop-color="#57E8FF"/>
      <stop offset="0.6" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#00D9FF"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.6 0; 0.1 0; -0.6 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CF9FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7CF9FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7CF9FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="aur1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#16202F" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <clipPath id="card">
      <rect x="1" y="1" width="998" height="298" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#080C14"/>

    <ellipse cx="190" cy="70" rx="300" ry="180" fill="url(#aur1)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 90 40; 0 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="830" cy="250" rx="330" ry="190" fill="url(#aur2)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -80 -40; 0 0" dur="19s" repeatCount="indefinite"/>
    </ellipse>

    <rect width="1000" height="300" fill="url(#grid)" opacity="0.55"/>

    <!-- scanning beam -->
    <rect x="-180" y="0" width="180" height="300" fill="url(#beam)" opacity="0.30">
      <animate attributeName="x" values="-180;1000" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <!-- monogram -->
    <g transform="translate(112,150)">
      <circle r="56" fill="none" stroke="url(#sweep)" stroke-width="1.4"
              stroke-dasharray="5 11" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="44" fill="#0C1420" stroke="#1E2C40" stroke-width="1.2"/>
      <circle r="44" fill="none" stroke="#00D9FF" stroke-width="1.2" opacity="0.7">
        <animate attributeName="r" values="44;66;66" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.65;0;0" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="12" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif"
            font-size="34" font-weight="bold" fill="url(#sweep)" filter="url(#glow)">PK</text>
    </g>

    <!-- status line -->
    <g transform="translate(206,86)">
      <circle cx="5" cy="-5" r="5" fill="#22E5A0">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="0" font-family="Verdana,DejaVu Sans,sans-serif" font-size="12"
            letter-spacing="3.5" fill="#6FE3C4">open to AI / ML engineering roles</text>
    </g>

    <!-- name -->
    <text x="206" y="150" font-family="Verdana,DejaVu Sans,sans-serif" font-size="50"
          font-weight="bold" letter-spacing="1.5" fill="url(#sweep)" filter="url(#glow)">Piyush Kumar</text>

    <text x="208" y="182" font-family="Verdana,DejaVu Sans,sans-serif" font-size="16"
          letter-spacing="1.2" fill="#93A9C4">AI/ML Engineer &#183; LLM Security &#183; Real-Time Vision</text>

    <!-- credential chips -->
    <g font-family="Verdana,DejaVu Sans,sans-serif" font-size="11.5" fill="#CFE9FF">
      <g opacity="0">
        <rect x="206" y="206" width="212" height="30" rx="15" fill="#0D1826" stroke="#1F3B52"/>
        <text x="222" y="225">Hackwave 2025 &#8212; 1st place</text>
        <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.10;0.95;1" dur="9s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <rect x="428" y="206" width="140" height="30" rx="15" fill="#0D1826" stroke="#1F3B52"/>
        <text x="444" y="225">372ms latency</text>
        <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.10;0.20;0.95;1" dur="9s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <rect x="578" y="206" width="122" height="30" rx="15" fill="#0D1826" stroke="#1F3B52"/>
        <text x="594" y="225">89.9% TPR</text>
        <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.20;0.30;0.95;1" dur="9s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <rect x="710" y="206" width="150" height="30" rx="15" fill="#0D1826" stroke="#1F3B52"/>
        <text x="726" y="225">B.Tech CSE &#8217;27</text>
        <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.30;0.40;0.95;1" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- neural constellation -->
    <g transform="translate(846,96)" stroke="#1E88A8" stroke-width="1" fill="#00D9FF" opacity="0.9">
      <path d="M0 0 L54 -28 M0 0 L54 26 M54 -28 L108 -2 M54 26 L108 -2 M54 -28 L54 26" opacity="0.45"/>
      <circle cx="0" cy="0" r="4.5" filter="url(#soft)"/>
      <circle cx="0" cy="0" r="3.5"/>
      <circle cx="54" cy="-28" r="3.5">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="54" cy="26" r="3.5">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="108" cy="-2" r="4.5" fill="#7C3AED">
        <animate attributeName="r" values="4.5;6.5;4.5" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- baseline accent -->
    <rect x="206" y="264" width="0" height="2.5" rx="1.25" fill="url(#sweep)">
      <animate attributeName="width" values="0;654;654;0" keyTimes="0;0.25;0.95;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="998" height="298" rx="20" fill="none" stroke="url(#sweep)" stroke-width="1.6" opacity="0.85"/>
</svg>
