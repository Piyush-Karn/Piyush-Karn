<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Results from shipped systems: 97 percent latency cut, 89.9 percent true positive rate, 93 percent detection accuracy, 84.8 percent injection detection" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Results from shipped systems</title>

  <defs>
    <linearGradient id="mA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D9FF"/><stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="mB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22E5A0"/><stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <linearGradient id="mC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="mD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B944"/><stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="mEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="mgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#131C2A" stroke-width="1"/>
    </pattern>
    <filter id="mglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="mcard"><rect x="1" y="1" width="998" height="238" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#mcard)">
    <rect width="1000" height="240" fill="#080C14"/>
    <rect width="1000" height="240" fill="url(#mgrid)" opacity="0.6"/>

    <g font-family="Verdana,DejaVu Sans,sans-serif" text-anchor="middle">

      <!-- gauge 1 : 97% latency cut -->
      <g>
        <circle cx="125" cy="100" r="42" fill="none" stroke="#152030" stroke-width="9"/>
        <circle cx="125" cy="100" r="42" fill="none" stroke="url(#mA)" stroke-width="9" stroke-linecap="round"
                stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90 125 100)" filter="url(#mglow)">
          <animate attributeName="stroke-dashoffset" values="264;264;7.9;7.9;264"
                   keyTimes="0;0.04;0.28;0.95;1" dur="9s" repeatCount="indefinite"/>
        </circle>
        <text x="125" y="107" font-size="21" font-weight="bold" fill="#E6EDF3">97%</text>
        <text x="125" y="176" font-size="13" fill="#C7D5E6">latency cut</text>
        <text x="125" y="197" font-size="11.5" fill="#6B7F98">IronGuard: 13s &#8594; 372ms</text>
      </g>

      <!-- gauge 2 : 89.9% TPR -->
      <g>
        <circle cx="375" cy="100" r="42" fill="none" stroke="#152030" stroke-width="9"/>
        <circle cx="375" cy="100" r="42" fill="none" stroke="url(#mB)" stroke-width="9" stroke-linecap="round"
                stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90 375 100)" filter="url(#mglow)">
          <animate attributeName="stroke-dashoffset" values="264;264;26.7;26.7;264"
                   keyTimes="0;0.08;0.32;0.95;1" dur="9s" repeatCount="indefinite"/>
        </circle>
        <text x="375" y="107" font-size="19" font-weight="bold" fill="#E6EDF3">89.9%</text>
        <text x="375" y="176" font-size="13" fill="#C7D5E6">true positive rate</text>
        <text x="375" y="197" font-size="11.5" fill="#6B7F98">2.7K+ adversarial prompts</text>
      </g>

      <!-- gauge 3 : 93% VisionX -->
      <g>
        <circle cx="625" cy="100" r="42" fill="none" stroke="#152030" stroke-width="9"/>
        <circle cx="625" cy="100" r="42" fill="none" stroke="url(#mC)" stroke-width="9" stroke-linecap="round"
                stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90 625 100)" filter="url(#mglow)">
          <animate attributeName="stroke-dashoffset" values="264;264;18.5;18.5;264"
                   keyTimes="0;0.12;0.36;0.95;1" dur="9s" repeatCount="indefinite"/>
        </circle>
        <text x="625" y="107" font-size="21" font-weight="bold" fill="#E6EDF3">93%</text>
        <text x="625" y="176" font-size="13" fill="#C7D5E6">object detection</text>
        <text x="625" y="197" font-size="11.5" fill="#6B7F98">VisionX, sub-100ms on edge</text>
      </g>

      <!-- gauge 4 : 84.8% -->
      <g>
        <circle cx="875" cy="100" r="42" fill="none" stroke="#152030" stroke-width="9"/>
        <circle cx="875" cy="100" r="42" fill="none" stroke="url(#mD)" stroke-width="9" stroke-linecap="round"
                stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90 875 100)" filter="url(#mglow)">
          <animate attributeName="stroke-dashoffset" values="264;264;40.1;40.1;264"
                   keyTimes="0;0.16;0.40;0.95;1" dur="9s" repeatCount="indefinite"/>
        </circle>
        <text x="875" y="107" font-size="19" font-weight="bold" fill="#E6EDF3">84.8%</text>
        <text x="875" y="176" font-size="13" fill="#C7D5E6">injection detection</text>
        <text x="875" y="197" font-size="11.5" fill="#6B7F98">up from a 64% baseline</text>
      </g>
    </g>

    <rect x="0" y="222" width="0" height="2" fill="url(#mEdge)">
      <animate attributeName="width" values="0;1000;1000;0" keyTimes="0;0.35;0.95;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="998" height="238" rx="18" fill="none" stroke="url(#mEdge)" stroke-width="1.4" opacity="0.7"/>
</svg>
