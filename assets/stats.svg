<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="GitHub statistics for Piyush-Karn" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>GitHub statistics for Piyush-Karn</title>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00D9FF"/><stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7CF9FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#7CF9FF" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#7CF9FF" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#131C2A" stroke-width="1"/>
  </pattern>
  <clipPath id="card"><rect x="1" y="1" width="998" height="278" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1000" height="280" fill="#080C14"/>
  <rect width="1000" height="280" fill="url(#grid)" opacity="0.6"/>
  <rect x="-190" y="0" width="190" height="280" fill="url(#beam)" opacity="0.5">
    <animate attributeName="x" values="-190;1000" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Verdana,DejaVu Sans,sans-serif">
    <g opacity="0">
      <text x="70" y="118" font-size="36" font-weight="bold" fill="#00D9FF">—</text>
      <text x="70" y="140" font-size="12" fill="#6B7F98">contributions this year</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.13;0.95;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0;0 14" keyTimes="0;0.05;0.13;0.95;1" dur="10s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="290" y="118" font-size="36" font-weight="bold" fill="#00D9FF">—</text>
      <text x="290" y="140" font-size="12" fill="#6B7F98">public repositories</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.18;0.95;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0;0 14" keyTimes="0;0.10;0.18;0.95;1" dur="10s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="70" y="216" font-size="36" font-weight="bold" fill="#00D9FF">—</text>
      <text x="70" y="238" font-size="12" fill="#6B7F98">stars earned</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.23;0.95;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0;0 14" keyTimes="0;0.15;0.23;0.95;1" dur="10s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="290" y="216" font-size="36" font-weight="bold" fill="#00D9FF">—</text>
      <text x="290" y="238" font-size="12" fill="#6B7F98">followers</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.28;0.95;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0;0 14" keyTimes="0;0.20;0.28;0.95;1" dur="10s" repeatCount="indefinite"/>
    </g>
    <text x="70" y="66" font-size="13" letter-spacing="2.5" fill="#C7D5E6">github activity</text>
    <line x1="520" y1="50" x2="520" y2="250" stroke="#152030" stroke-width="1"/>
    <text x="570" y="66" font-size="13" letter-spacing="2.5" fill="#C7D5E6">most used languages</text>
  </g>
</g>
<rect x="1" y="1" width="998" height="278" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.4" opacity="0.75"/>
</svg>
